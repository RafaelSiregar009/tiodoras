name: tiodoras_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  supabase_flutter: ^2.5.0
  flutter_riverpod: ^2.5.1
  go_router: ^14.0.0
  image_picker: ^1.1.2
  intl: 0.20.2
  cached_network_image: ^3.3.1
  # FIX (fitur baru): push notification ke HP admin saat ada pengajuan
  # pelunasan/perpanjangan dari petugas (lihat lib/services/fcm_service.dart).
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png

# FIX (fitur baru): konfigurasi generate ikon aplikasi dari satu gambar
# (assets/icon/icon.png) ke semua platform yang dipakai project ini
# (Android, iOS, Web, Windows, macOS). Cara pakai: setelah ganti gambar
# sumbernya, jalankan `flutter pub get` lalu
# `dart run flutter_launcher_icons` di terminal.
flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  android: "launcher_icon"
  ios: true
  web:
    generate: true
  windows:
    generate: true
  macos:
    generate: true